name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *" # daily refresh of the repo list
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public repos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          cp index.html _site/
          gh api "users/${{ github.repository_owner }}/repos?type=owner&per_page=100" --paginate \
            | jq -s 'add | map(select(.private == false)
                | {name, html_url, description, homepage, language, topics, fork, archived,
                   stargazers_count, created_at, pushed_at, private})' > _site/repos.json
          echo "Repos: $(jq length _site/repos.json)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
