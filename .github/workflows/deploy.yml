name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *" # daily refresh of the repo list
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Optional: a read-only token that can see private repos, so yearly stats stay fresh.
          # Without it the committed stats.json is used as-is.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          mkdir -p _site
          cp -R index.html assets _site/
          python3 scripts/build_data.py "${{ github.repository_owner }}" _site/repos.json
          if [ -n "$STATS_TOKEN" ]; then
            GITHUB_TOKEN="$STATS_TOKEN" python3 scripts/build_stats.py "${{ github.repository_owner }}" _site/stats.json
          else
            cp stats.json _site/
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
